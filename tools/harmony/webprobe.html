<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GPU / WASM 能力探针</title>
<style>
  html,body{margin:0;padding:8px;background:#0c0a10;color:#d7dce3;
    font:11px/1.5 ui-monospace,Menlo,Consolas,monospace}
  #log{white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<div id="log"></div>
<script>
(function () {
  var out = document.getElementById('log');
  function emit(k, v) {
    var line = 'WEBPROBE ' + k + '=' + v;
    out.innerHTML += line + '\n';
    console.log(line);
  }

  emit('origin', location.origin);
  emit('protocol', location.protocol);
  emit('ua', navigator.userAgent);
  emit('hardwareConcurrency', String(navigator.hardwareConcurrency));
  emit('deviceMemory', String(navigator.deviceMemory || '?'));
  emit('crossOriginIsolated', String(!!self.crossOriginIsolated));
  emit('SharedArrayBuffer', String(typeof SharedArrayBuffer !== 'undefined'));

  /* ---------- WebGL2 + 真实 GPU 型号 ---------- */
  var canvas = document.createElement('canvas');
  canvas.width = 1024; canvas.height = 1024;
  canvas.style.width = '256px'; canvas.style.height = '256px';
  document.body.appendChild(canvas);
  var gl2 = canvas.getContext('webgl2', { antialias: false, depth: false, stencil: false });
  emit('webgl2', gl2 ? 'YES' : 'NO');
  var gl = gl2 || canvas.getContext('webgl');
  emit('webgl1', gl ? 'YES' : 'NO');
  if (gl) {
    var dbg = gl.getExtension('WEBGL_debug_renderer_info');
    if (dbg) {
      emit('gpu.vendor', String(gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL)));
      emit('gpu.renderer', String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)));
    } else {
      emit('gpu.vendor', String(gl.getParameter(gl.VENDOR)));
      emit('gpu.renderer', String(gl.getParameter(gl.RENDERER)));
    }
    emit('gl.version', String(gl.getParameter(gl.VERSION)));
    emit('gl.maxTexture', String(gl.getParameter(gl.MAX_TEXTURE_SIZE)));
    emit('gl.maxVaryings', String(gl.getParameter(gl.MAX_VARYING_VECTORS)));
  }

  /* ---------- WebGPU ---------- */
  emit('webgpu.navigatorGpu', String(!!navigator.gpu));
  if (navigator.gpu) {
    navigator.gpu.requestAdapter().then(function (ad) {
      if (!ad) { emit('webgpu.adapter', 'NULL'); return; }
      emit('webgpu.adapter', 'OK');
      var inf = ad.info || {};
      emit('webgpu.vendor', String(inf.vendor || '?'));
      emit('webgpu.architecture', String(inf.architecture || '?'));
      return ad.requestDevice().then(function (d) {
        emit('webgpu.device', d ? 'OK' : 'NULL');
      }).catch(function (e) { emit('webgpu.device.err', String(e && e.message || e)); });
    }).catch(function (e) { emit('webgpu.requestAdapter.err', String(e && e.message || e)); });
  }

  /* ---------- WASM 特性 ----------
     字节码逐字节取自 wasm-feature-detect@3 官方实现（Thomas Steiner 维护，社区事实标准），
     并已在本机 Node 22 / V8 12.4 上先行 validate=true 校验通过（见 wasm_bytes_verified.json）。
     上一版为手写字节码，因 memory.copy 少一个 memidx 字节、trunc_sat 缺 drop，
     导致模块非法 → validate=false → 误报"不支持"。此处已更正。 */
  function wf(bytes) {
    try { return String(WebAssembly.validate(new Uint8Array(bytes))); }
    catch (e) { return 'ERR:' + String((e && e.message) || e); }
  }
  // v128.const / f32x4.splat（Fixed-Width SIMD）
  emit('wasm.simd', wf([0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,10,1,8,0,65,0,253,15,253,98,11]));
  // memory.copy（Bulk memory operations）
  emit('wasm.bulkMemory', wf([0,97,115,109,1,0,0,0,1,4,1,96,0,0,3,2,1,0,5,3,1,0,1,10,14,1,12,0,65,0,65,0,65,0,252,10,0,0,11]));
  // i32.trunc_sat_f32_s（Non-trapping float-to-int conversions）
  emit('wasm.truncSat', wf([0,97,115,109,1,0,0,0,1,4,1,96,0,0,3,2,1,0,10,12,1,10,0,67,0,0,0,0,252,0,26,11]));
  // i32.extend8_s（Sign-extension operators）
  emit('wasm.signExtensions', wf([0,97,115,109,1,0,0,0,1,4,1,96,0,0,3,2,1,0,10,8,1,6,0,65,0,192,26,11]));
  // 多返回值（Multi-value）
  emit('wasm.multiValue', wf([0,97,115,109,1,0,0,0,1,6,1,96,0,2,127,127,3,2,1,0,10,8,1,6,0,65,0,65,0,11]));
  // ref.null func（Reference types）
  emit('wasm.referenceTypes', wf([0,97,115,109,1,0,0,0,1,4,1,96,0,0,3,2,1,0,10,7,1,5,0,208,112,26,11]));
  // i64 参数与返回值（BigInt ↔ WebAssembly）
  emit('wasm.bigInt', wf([0,97,115,109,1,0,0,0,1,6,1,96,1,126,1,126,3,2,1,0,7,5,1,1,98,0,0,10,6,1,4,0,32,0,11]));
  // Threads：官方口径 = 原子指令模块合法 且 SharedArrayBuffer 可跨 MessageChannel 传递
  emit('wasm.threads.atomics', wf([0,97,115,109,1,0,0,0,1,4,1,96,0,0,3,2,1,0,5,4,1,3,1,1,10,11,1,9,0,65,0,254,16,2,0,26,11]));
  (function () {
    var transferable = false;
    try {
      if (typeof MessageChannel !== 'undefined') {
        new MessageChannel().port1.postMessage(new SharedArrayBuffer(1));
        transferable = true;
      }
    } catch (e) { transferable = false; }
    emit('wasm.threads.sabTransferable', String(transferable));
  })();

  /* ---------- WebGL2 片段着色器吞吐微基准 ---------- */
  function bench(glc, iters, frames, px) {
    var vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
    var body = 'precision highp float;uniform float u;void main(){float x=u;';
    for (var i = 0; i < iters; i++) { body += 'x=sin(x)*cos(x)+0.1;x=x*0.999+0.001;'; }
    body += 'gl_FragColor=vec4(fract(x),fract(x*1.3),fract(x*1.7),1.);}';
    function sh(t, s) {
      var o = glc.createShader(t); glc.shaderSource(o, s); glc.compileShader(o);
      return glc.getShaderParameter(o, glc.COMPILE_STATUS) ? o : null;
    }
    var v = sh(glc.VERTEX_SHADER, vs), f = sh(glc.FRAGMENT_SHADER, body);
    if (!v || !f) { return null; }
    var pr = glc.createProgram(); glc.attachShader(pr, v); glc.attachShader(pr, f); glc.linkProgram(pr);
    if (!glc.getProgramParameter(pr, glc.LINK_STATUS)) { return null; }
    glc.useProgram(pr);
    var buf = glc.createBuffer();
    glc.bindBuffer(glc.ARRAY_BUFFER, buf);
    glc.bufferData(glc.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), glc.STATIC_DRAW);
    var loc = glc.getAttribLocation(pr, 'p');
    glc.enableVertexAttribArray(loc);
    glc.vertexAttribPointer(loc, 2, glc.FLOAT, false, 0, 0);
    var u = glc.getUniformLocation(pr, 'u');
    glc.viewport(0, 0, px, px);
    var sync = new Uint8Array(4);
    function force() { glc.readPixels(0, 0, 1, 1, glc.RGBA, glc.UNSIGNED_BYTE, sync); }
    glc.uniform1f(u, 0.5); glc.drawArrays(glc.TRIANGLES, 0, 3); force();
    var t0 = performance.now();
    for (var k = 0; k < frames; k++) {
      glc.uniform1f(u, 0.5 + k * 0.001);
      glc.drawArrays(glc.TRIANGLES, 0, 3);
    }
    force();
    var total = performance.now() - t0;
    var ops = px * px * iters * 6 * frames;
    return { total: total, perFrame: total / frames, gflops: ops / (total / 1000) / 1e9 };
  }

  if (gl2) {
    var r = bench(gl2, 400, 60, 1024);
    if (r) {
      emit('bench.gl2.totalMs', r.total.toFixed(1));
      emit('bench.gl2.msPerFrame', r.perFrame.toFixed(3));
      emit('bench.gl2.gflops', r.gflops.toFixed(2));
    } else {
      emit('bench.gl2', 'SHADER-FAIL');
    }
  }

  emit('DONE', '1');
})();
</script>
</body>
</html>
